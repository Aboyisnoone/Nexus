services:
  - type: web
    name: nexus-agent-lab
    runtime: docker
    plan: free
    region: oregon
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_ID
        value: gemini-3.1-flash-lite
      - key: DATABASE_URL
        value: sqlite:///nexus.db
